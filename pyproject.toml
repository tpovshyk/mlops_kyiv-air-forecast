[project]
name = "kyiv-air-forecast"
version = "0.1.0"
description = "Прогноз PM2.5 на 24 години для районів Києва (курс MLOps, KSE)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "lightgbm>=4.7.0",
    "mlflow-skinny==3.16.1",
    "pandas>=2.2,<3",
    "psycopg2-binary>=2.9.13",
    "pyarrow>=26.0.1",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F — помилки й стиль, I — порядок імпортів, B — типові баги, UP — сучасний синтаксис
select = ["E", "F", "I", "B", "UP"]

[dependency-groups]
dev = [
    "dvc==3.67.1",
    "dvc-s3==3.3.0",
    "pre-commit>=4.7.0",
    "ruff>=0.17.4",
]
